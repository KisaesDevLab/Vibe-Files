[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.59"
edition = "2024"
# VibeMyFirm Community License 1.0 from 0.1.52 (owner 2026-11-22, PA-101, Q-144); NOTICE.md.
# 0.1.51 and earlier were AGPL-3.0-or-later.
license-file = "LICENSE.md"
homepage = "https://github.com/KisaesDevLab/vibe-files-releases"
publish = false

# Versions pinned to the vendored Vibe Filer Desktop (ea4e726, v0.2.4) so its code builds unchanged.
[workspace.dependencies]
eframe = "0.37.0"
arboard = { version = "3.7.0", default-features = false }
egui = "0.37.0"
egui_extras = "0.37.0"
egui_kittest = { version = "0.37.0", features = ["eframe", "wgpu"] }
rfd = "0.17.2"
notify = "8.2.1"
notify-debouncer-mini = "0.7.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
csv = "1.4.0"
regex = "1.13.1"
strsim = "0.11.1"
lopdf = "0.47.0"
pdfium-render = "0.9.5"
sha2 = "0.10.9"
chrono = { version = "0.4.45", features = ["serde"] }
anyhow = "1.0.104"
thiserror = "2.0.21"
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = "0.3.23"
uuid = { version = "1.29.0", features = ["v4", "v7", "serde"] }
clap = { version = "4.6.7", features = ["derive"] }
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_Threading", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
zip = { version = "9.2.1", default-features = false, features = ["deflate"] }
tempfile = "3.27.0"

# New crates (not used by the vendored code).
argon2 = "0.5.3"
chacha20poly1305 = "0.10.1"
hkdf = "0.12.4"
zeroize = "1.9.1"
hmac = "0.12.1"
# B2 through its S3-compatible API (P11). tokio stays inside vf-sync (and vf-ocr's workers).
# aws-base/http-base with ring, not aws/http: those pull aws-lc-rs, a C library whose error
# strings carry this PC's build paths into the exe (check-binary caught it; Q-146). TLS is
# reqwest's rustls on ring, set up in vf-sync.
object_store = { version = "0.14", default-features = false, features = ["aws-base", "http-base", "fs", "reqwest", "ring"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "http2", "charset"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "time"] }
futures = "0.3"
bytes = "1"
getrandom = "0.3.4"
toml = "1.1.8"
pdf-writer = "0.14.0"
# Barcodes: no image feature (it pins an older `image`), no client/URI parsing.
rxing = { version = "0.9.3", default-features = false, features = ["encoders", "decoders", "qrcode", "oned", "encoding_rs"] }
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "tiff", "bmp", "gif"] }
tiff = "0.11.3"
calamine = { version = "0.38.0", features = ["dates"] }
cfb = "0.16.0"
mailparse = "0.18.0"
quick-xml = "0.42.0"
rust_xlsxwriter = { version = "0.102.0", default-features = false }
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_Storage_CloudFilters", "Win32_System_Registry", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_Graphics_Gdi", "Win32_UI_Controls_Dialogs", "Win32_Storage_Xps", "Win32_System_Memory", "Win32_System_LibraryLoader", "Win32_System_ProcessStatus", "Win32_System_Console", "Win32_Security_Cryptography", "Win32_System_Threading", "Win32_System_RemoteDesktop", "Win32_System_JobObjects", "Win32_System_Diagnostics_Debug", "Win32_Graphics_Imaging", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Variant", "Devices_Enumeration", "Devices_Scanners", "Storage", "Storage_Search", "Storage_Streams", "Foundation_Collections"] }

# Argon2id is unusably slow unoptimized; tests and debug builds unwrap keys.
[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.blake2]
opt-level = 3

# Barcode search over every scanned page is unusably slow unoptimized.
[profile.dev.package.rxing]
opt-level = 3

# Image decode / resize / encode (P02 image normalization, P04 redaction, PDF/A, compress):
# unoptimized they make tests and debug builds crawl.
[profile.dev.package.image]
opt-level = 3

[profile.dev.package.zune-jpeg]
opt-level = 3

[profile.release]
# PA-100 R2: no debug info, symbols stripped, whole-program LTO, one codegen unit.
debug = false
opt-level = "z"
lto = true
strip = true
codegen-units = 1
