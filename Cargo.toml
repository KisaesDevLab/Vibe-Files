[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license-file = "LICENSE"
publish = false

# Versions pinned to the vendored Vibe Filer Desktop (ea4e726, v0.2.4) so its code builds unchanged.
[workspace.dependencies]
eframe = "0.37.0"
egui = "0.37.0"
egui_extras = "0.37.0"
egui_kittest = { version = "0.37.0", features = ["eframe", "wgpu"] }
rfd = "0.17.2"
notify = "8.2.1"
notify-debouncer-mini = "0.7.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
csv = "1.4.0"
regex = "1.13.1"
strsim = "0.11.1"
lopdf = "0.38.0"
pdfium-render = "0.9.5"
sha2 = "0.10.9"
chrono = { version = "0.4.45", features = ["serde"] }
anyhow = "1.0.104"
thiserror = "2.0.21"
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = "0.3.23"
uuid = { version = "1.29.0", features = ["v4", "v7", "serde"] }
clap = { version = "4.6.7", features = ["derive"] }
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_Threading"] }
zip = { version = "9.2.1", default-features = false, features = ["deflate"] }
tempfile = "3.27.0"

# Image work (deskew, resize, barcode decode) is too slow unoptimized, even in tests.
[profile.dev.package.image]
opt-level = 2
[profile.dev.package.imageproc]
opt-level = 2
[profile.dev.package.rxing]
opt-level = 2
[profile.dev.package.zune-jpeg]
opt-level = 2

[profile.release]
opt-level = "z"
lto = true
strip = true
codegen-units = 1
