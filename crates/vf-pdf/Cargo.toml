[package]
name = "vf-pdf"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
# A test form for other crates' tests (`forms::write_test_form`).
test-support = []

[dependencies]
lopdf.workspace = true
pdfium-render.workspace = true
image.workspace = true
regex.workspace = true
pdf-writer.workspace = true
serde.workspace = true

[dev-dependencies]
# Its own test form (`forms::write_test_form`) in the integration tests.
vf-pdf = { path = ".", features = ["test-support"] }
serde_json.workspace = true
filer-pdf = { path = "../filer-pdf", features = ["test-support"] }
tempfile.workspace = true
vf-fixtures = { path = "../vf-fixtures" }
vf-ingest = { path = "../vf-ingest" }
