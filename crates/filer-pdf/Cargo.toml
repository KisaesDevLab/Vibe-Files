[package]
name = "filer-pdf"
# Upstream version kept so the vendored About/footer text is unchanged. See VENDORED.md.
version = "0.2.6"
edition.workspace = true
publish.workspace = true
license.workspace = true

[features]
# Turns on the upstream `#[cfg(test)]` helpers that other vendored crates' tests use.
test-support = ["filer-core/test-support"]

[dependencies]
eframe.workspace = true
egui.workspace = true
egui_extras.workspace = true
rfd.workspace = true
notify.workspace = true
notify-debouncer-mini.workspace = true
serde.workspace = true
serde_json.workspace = true
csv.workspace = true
regex.workspace = true
strsim.workspace = true
lopdf.workspace = true
pdfium-render.workspace = true
sha2.workspace = true
chrono.workspace = true
anyhow.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-appender.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true
clap.workspace = true
windows-sys.workspace = true
zip.workspace = true
filer-core = { path = "../filer-core" }

[dev-dependencies]
egui_kittest.workspace = true
tempfile.workspace = true
filer-core = { path = "../filer-core", features = ["test-support"] }
